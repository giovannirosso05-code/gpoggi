name: Video da spec

# Quando in video/spec/ arriva un file .json (la scaletta di un video fatto a mano), il video si genera qui
# (la voce funziona su GitHub) e parte sul Telegram insieme alla copertina (.png) e alla didascalia (.txt) con lo stesso nome.
on:
  push:
    branches: [main]
    paths:
      - 'video/spec/*.json'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: video-da-spec
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt edge-tts playwright
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Genera i video nuovi
        run: |
          mkdir -p invio
          for s in video/spec/*.json; do
            n=$(basename "$s" .json)
            if [ -e "invio/$n.mp4" ] || grep -q "\"$n.mp4\"" video/inviati.json; then continue; fi
            python video/notizia_sub.py "$s" "invio/$n.mp4"
            for e in png txt; do [ -e "video/spec/$n.$e" ] && cp "video/spec/$n.$e" "invio/$n.$e"; done
          done
      - name: Invia su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE || secrets.TELEGRAM_CHAT_ID || '559225883' }}
        run: pip install requests && python video/invia_cartella.py
      - name: Salva
        if: always()
        run: |
          git config user.name "gpoggi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add video/inviati.json invio 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "video da spec: inviati" && git pull --rebase --autostash -X theirs origin main && git push)
      - name: Avvisa su Telegram se il video non è riuscito
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CANALE || secrets.TELEGRAM_CHAT_ID || '559225883' }}
        run: |
          [ -n "$TOKEN" ] && curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" -d chat_id="$CHAT" --data-urlencode "text=⚠️ Il video non è riuscito. Dettagli: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null || true
