name: Aggiorna dati F1

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Scarica i dati (se c'è una sessione dal vivo si salta il giro)
        run: python scraper_f1.py || [ $? -eq 75 ]
      - name: Rassegna stampa F1
        run: python build_news.py
      - name: Calendario MotoGP
        run: python build_motogp.py
      - name: Ora di partenza delle gare (per chiudere i voti del pronostico)
        run: python build_orari_gara.py
      - name: Schede carriera e biografie (riprende da dove era arrivato; prima delle foto, che si fidano dei dati verificati qui)
        run: python build_schede.py || true
      - name: Report MotoGP, foto e mappe (solo le novità), pronostici
        run: |
          python build_report_moto.py
          python build_cronaca.py || true
          python foto_motogp.py || true
          python foto_circuiti_moto.py || true
          python build_pronostici.py
      - name: Classifiche F2 e F3 (Wikipedia)
        run: python build_formule.py
      - name: Foto dei piloti del passato (solo licenze libere, riprende da dove era arrivato)
        run: python build_foto_storici.py || true
      - name: Archivi storici F1 e MotoGP (solo il lunedì)
        run: if [ "$(date +%u)" = "1" ]; then python build_archivio.py && python build_motogp_archivio.py; fi
      - name: Calendari scaricabili
        run: python build_calendari.py
      - name: Pubblica la gara sul canale Telegram (una sola volta per gara)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MODALITA: privata
        run: python telegram_post.py
      - name: Chiedi un voto su una notizia (ogni giorno intorno alle 14:00 Roma)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE || secrets.TELEGRAM_CHAT_ID }}
          VOTI_WORKER_URL: ${{ secrets.VOTI_WORKER_URL || 'https://gpoggivotti.giovannirosso05.workers.dev' }}
        run: |
          h=$(date -u +%H)
          if [ "$h" = "12" ] || [ "$h" = "13" ]; then python telegram_vota.py || true; fi
      - name: Report di fine giornata con le notizie e i voti (solo al giro serale, circa le 20 in Italia)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE || secrets.TELEGRAM_CHAT_ID }}
        run: |
          h=$(date -u +%H)
          if [ "$h" = "18" ] || [ "$h" = "19" ]; then python telegram_report.py || true; fi
      - name: Commit se ci sono novità
        run: |
          git config user.name "gpoggi-bot"
          git config user.email "actions@users.noreply.github.com"
          # ogni percorso si aggiunge da solo: se uno manca (per esempio il file dei sondaggi la prima volta) gli altri entrano comunque
          git add docs/data docs/calendario docs/img/foto docs/img/storici
          for f in foto_storici_cache.json foto_cache.json foto_motogp_cache.json foto_motogp_cache_v2.json foto_circuiti_moto_cache.json schede_cache.json telegram_stato.json telegram_voti.json video/scelta.json; do
            [ -e "$f" ] && git add "$f" || true
          done
          git diff --cached --quiet || (git commit -m "dati: aggiornamento da OpenF1" && git pull --rebase --autostash -X theirs origin main && git push)
