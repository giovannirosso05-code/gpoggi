name: Aggiorna dati F1

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Scarica i dati (se c'è una sessione dal vivo si salta il giro)
        run: python scraper_f1.py || [ $? -eq 75 ]
      - name: Rassegna stampa F1
        run: python build_news.py
      - name: Pubblica la gara sul canale Telegram (una sola volta per gara)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE }}
        run: python telegram_post.py
      - name: Commit se ci sono novità
        run: |
          git config user.name "gpoggi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data docs/img/foto foto_cache.json telegram_stato.json 2>/dev/null || git add docs/data docs/img/foto foto_cache.json
          git diff --cached --quiet || (git commit -m "dati: aggiornamento da OpenF1" && git push)
