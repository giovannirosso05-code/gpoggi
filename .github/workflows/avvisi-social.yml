name: Avvisi dichiarazioni social

# Ogni mezz'ora: se un pilota importante scrive o dice qualcosa sui social (riportato dalle testate) arriva un avviso su Telegram
# con il comando per fare subito il video. Niente modelli di linguaggio.
on:
  schedule:
    - cron: '7,37 5-22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avvisi-social
  cancel-in-progress: false

jobs:
  avvisi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Aggiorna le notizie e avvisa
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE || secrets.TELEGRAM_CHAT_ID || '559225883' }}
        run: |
          python build_news.py || echo "notizie non aggiornate"
          python avvisi_social.py
      - name: Salva notizie e stato
        run: |
          git config user.name "gpoggi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/rassegna.json avvisi_social.json
          git diff --cached --quiet || (git commit -m "notizie: aggiornamento e avvisi social" && git pull --rebase --autostash -X theirs origin main && git push)
