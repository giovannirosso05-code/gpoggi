name: Video automatici

# Tre video di notizie al giorno (orari UTC: 07:30, 13:30, 19:30 ora italiana d'estate) e il giovedì sera quello sui pronostici.
# Il video arriva sul tuo Telegram, senza notifica. Funziona anche se Claude non è in uso.
on:
  schedule:
    - cron: '30 5 * * *'
    - cron: '30 11 * * *'
    - cron: '30 17 * * *'
    - cron: '0 17 * * 4'
  workflow_dispatch:
    inputs:
      cosa:
        description: 'notizia oppure previsioni'
        default: 'notizia'

permissions:
  contents: write

concurrency:
  group: video-automatici
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt edge-tts playwright
      - run: python -m playwright install --with-deps chromium
      - name: Quale video
        id: quale
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "cosa=${{ github.event.inputs.cosa }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 17 * * 4" ]; then echo "cosa=previsioni" >> $GITHUB_OUTPUT
          else echo "cosa=notizia" >> $GITHUB_OUTPUT; fi
      - name: Prepara e invia il video
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE || secrets.TELEGRAM_CHAT_ID }}
        run: python video/auto_video.py ${{ steps.quale.outputs.cosa }} --invia --uscita "$RUNNER_TEMP/video.mp4"
      - name: Salva lo stato (video già fatti)
        run: |
          git config user.name "gpoggi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add video_stato.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "video: stato" && git pull --rebase --autostash -X theirs origin main && git push)
