name: Aggiorna dati F1

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scraper_f1.py
      - name: Commit se ci sono novità
        run: |
          git config user.name "gpoggi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data docs/img/foto
          git diff --cached --quiet || (git commit -m "dati: aggiornamento da OpenF1" && git push)
