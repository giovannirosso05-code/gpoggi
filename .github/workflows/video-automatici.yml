name: Video automatici

# Ogni giorno alle 12:00 (ora italiana) due video di notizie raccontate, e il giovedì sera quello sui pronostici.
# Il video arriva sul tuo Telegram, senza notifica. Funziona anche se Claude non è in uso.
on:
  schedule:
    # ogni giorno alle 12:00 italiane due video di notizie: due orari UTC (estate e inverno), ne parte uno solo grazie al controllo dell'ora e a "una volta al giorno"
    - cron: '7 10 * * *'
    - cron: '7 11 * * *'
    - cron: '7 17 * * 4'
    # - cron: '0 6 * * *'   # gioco del giorno in video: spento, mostrava un gioco che sul sito non c'è (si può lanciare a mano con cosa=gioco)
  workflow_dispatch:
    inputs:
      cosa:
        description: 'notizie (due raccontate, una volta al giorno), notizie-ora (due raccontate subito), notizia (una semplice), previsioni oppure gioco'
        default: 'notizie'

permissions:
  contents: write

concurrency:
  group: video-automatici
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt edge-tts playwright
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Quale video
        id: quale
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "cosa=${{ github.event.inputs.cosa }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "7 17 * * 4" ]; then echo "cosa=previsioni" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then echo "cosa=gioco" >> $GITHUB_OUTPUT
          elif [ "$(TZ=Europe/Rome date +%H)" = "12" ] || [ "$(TZ=Europe/Rome date +%H)" = "13" ]; then echo "cosa=notizie" >> $GITHUB_OUTPUT
          else echo "cosa=salta" >> $GITHUB_OUTPUT; fi
      - name: Prepara e invia il video
        if: steps.quale.outputs.cosa != 'salta'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE || secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "${{ steps.quale.outputs.cosa }}" in
            gioco) python video/gioco.py giorno --invia --uscita "$RUNNER_TEMP/gioco.mp4" ;;
            notizie) python video/notizie_giorno.py --una-volta-al-giorno ;;
            notizie-ora) python video/notizie_giorno.py ;;
            *) python video/auto_video.py ${{ steps.quale.outputs.cosa }} --invia --uscita "$RUNNER_TEMP/video.mp4" ;;
          esac
      - name: Salva lo stato (video già fatti)
        run: |
          git config user.name "gpoggi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add video_stato.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "video: stato" && git pull --rebase --autostash -X theirs origin main && git push)
