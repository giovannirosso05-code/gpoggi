name: Invio su Telegram

# Quando in invio/ arrivano un video e/o una copertina (con un .txt dallo stesso nome per la didascalia),
# li manda sul tuo Telegram, senza dover lanciare niente a mano. I file già inviati sono ricordati in video/inviati.json.
on:
  push:
    branches: [main]
    paths:
      - 'invio/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: invio-telegram
  cancel-in-progress: false

jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Invia i file nuovi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE || secrets.TELEGRAM_CHAT_ID || '559225883' }}
        run: python video/invia_cartella.py
      - name: Salva l'elenco dei file inviati
        if: always()
        run: |
          git config user.name "gpoggi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add video/inviati.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "invio: elenco inviati" && git pull --rebase --autostash -X theirs origin main && git push)
