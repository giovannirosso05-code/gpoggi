<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='90'>🏁</text></svg>">
<meta name="theme-color" content="#0a0a0d">
<title>Confronto Piloti — F1 Oggi</title>
<meta name="description" content="Confronta due piloti Formula 1. Statistiche, team, numeri di gara a confronto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=202610031">
<script defer data-domain="f1oggi.it" src="https://plausible.io/js/script.js"></script>
</head>
<body>

<header id="site-header" class="site-header"></header>

<div class="container">
  <section class="hero" style="text-align: center; padding: 32px 0;">
    <h1>Confronta Piloti</h1>
    <p style="color: var(--text-secondary); margin: 8px 0 0;">Metti a confronto due piloti F1</p>
  </section>

  <div id="confronto-container" style="max-width: 900px; margin: 32px auto;">
    <div class="search-input" style="margin-bottom: 24px;">
      <input id="pilota-1" type="text" placeholder="Seleziona primo pilota..." style="
        width: 100%;
        padding: 10px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-size: 14px;
        font-family: var(--font-body);
      ">
    </div>

    <div class="search-input" style="margin-bottom: 24px;">
      <input id="pilota-2" type="text" placeholder="Seleziona secondo pilota..." style="
        width: 100%;
        padding: 10px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-size: 14px;
        font-family: var(--font-body);
      ">
    </div>

    <div class="compare-layout">
      <div id="pilota-1"></div>
      <div id="pilota-2"></div>
    </div>

    <p style="text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 28px;">
      Dati in tempo reale da OpenF1. Ulteriori statistiche saranno aggiunte presto.
    </p>
  </div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script type="module" src="js/confronto.js?v=202610031"></script>
</body>
</html>
