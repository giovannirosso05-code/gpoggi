name: Video lezione

# Video lezione «Diritto dei trasporti» (Argomenti 1-8): una voce che spiega, con gli schemi mostrati. Si lancia a mano; il video (≈85 min) va sul Telegram del proprietario.
on:
  workflow_dispatch:
    inputs:
      solo:
        description: 'argomenti da fare, separati da virgola (vuoto = tutti, da 1 a 8)'
        default: ''
      prova:
        description: 'solo le prime N battute (prova veloce; vuoto = tutto)'
        default: ''

permissions:
  contents: read

concurrency:
  group: video-lezione-${{ github.event.inputs.solo }}
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt edge-tts piper-tts kokoro-onnx soundfile azure-cognitiveservices-speech playwright
      - run: python -m playwright install --with-deps chromium
      - name: Installa ffmpeg
        run: |
          for i in 1 2 3; do timeout 150 sudo apt-get update -qq && timeout 200 sudo apt-get install -y -qq ffmpeg && break; sleep 5; done
      - name: Crea e invia la video lezione
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE || secrets.TELEGRAM_CHAT_ID || '559225883' }}
          SOLO: ${{ github.event.inputs.solo }}
          PROVA: ${{ github.event.inputs.prova }}
        run: |
          python video/lezione.py $( [ -n "$SOLO" ] && echo --solo "$SOLO" ) $( [ -n "$PROVA" ] && echo --prova "$PROVA" ) --invia --uscita /tmp/lezione.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video-lezione
          path: |
            /tmp/lezione.mp4
            /tmp/lezione.capitoli.txt
          retention-days: 7
