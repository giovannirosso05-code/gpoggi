name: Foto trofeo

# Scarica da Wikimedia Commons (CC BY-SA) la foto del trofeo del campionato piloti per le copertine: video/extra/trofeo-f1.jpg
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python video/scarica_trofeo.py
      - name: Salva
        run: |
          git config user.name "gpoggi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f video/extra/trofeo-f1.jpg video/extra/trofeo-f1.json
          git diff --cached --quiet || (git commit -m "foto trofeo F1 (Commons)" && git pull --rebase --autostash -X theirs origin main && git push)
