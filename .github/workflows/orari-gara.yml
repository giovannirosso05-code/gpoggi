name: Orari prossima gara

# Comando /gara, /garaf1 o /garamoto sul bot Telegram: video con tutti gli orari della prossima gara sempre a schermo, la voce che li legge e il favorito. Nessun modello di linguaggio.
on:
  workflow_dispatch:
    inputs:
      serie:
        description: 'auto (la prima in calendario), f1 oppure motogp'
        default: 'auto'

permissions:
  contents: read

concurrency:
  group: orari-gara
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt edge-tts piper-tts kokoro-onnx soundfile azure-cognitiveservices-speech playwright
      - run: python -m playwright install --with-deps chromium
      - name: Installa ffmpeg
        run: |
          for i in 1 2 3; do timeout 150 sudo apt-get update -qq && timeout 200 sudo apt-get install -y -qq ffmpeg && break; sleep 5; done
      - name: Prepara e invia il video
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE || secrets.TELEGRAM_CHAT_ID || '559225883' }}
          SERIE: ${{ github.event.inputs.serie }}
        run: |
          python video/orari_gp.py "${SERIE:-auto}" --invia --avvisa
