name: Riassunto gara

# Riassunto della gara di F1 appena finita (si lancia a mano dopo che i risultati sono nei dati). Copia in video/pronti per riaverla in chat.
on:
  workflow_dispatch:
    inputs:
      bene:
        description: 'pilota che ha reso più del previsto'
        default: 'Charles Leclerc'
      male:
        description: 'pilota che ha deluso'
        default: 'George Russell'

permissions:
  contents: write

concurrency:
  group: riassunto-gara
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt edge-tts piper-tts kokoro-onnx soundfile azure-cognitiveservices-speech playwright
      - run: python -m playwright install --with-deps chromium
      - name: Installa ffmpeg
        run: |
          for i in 1 2 3; do timeout 150 sudo apt-get update -qq && timeout 200 sudo apt-get install -y -qq ffmpeg && break; sleep 5; done
      - name: Prepara e invia il video
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE || secrets.TELEGRAM_CHAT_ID || '559225883' }}
          BENE: ${{ github.event.inputs.bene }}
          MALE: ${{ github.event.inputs.male }}
        run: |
          mkdir -p video/pronti
          python video/riassunto_gara.py --bene "${BENE:-Charles Leclerc}" --male "${MALE:-George Russell}" --invia --uscita "video/pronti/riassunto-$(date +%Y%m%d-%H%M).mp4"
      - name: Tiene una copia del video nel repository (per riaverlo in chat)
        run: |
          git config user.name "gpoggi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add video/pronti
          git diff --cached --quiet || (git commit -m "riassunto gara: copia del video" && git pull --rebase --autostash -X theirs origin main && git push)
