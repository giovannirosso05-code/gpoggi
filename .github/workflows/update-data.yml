name: Aggiorna dati F1

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Scarica i dati (se c'è una sessione dal vivo si salta il giro)
        run: python scraper_f1.py || [ $? -eq 75 ]
      - name: Rassegna stampa F1
        run: python build_news.py
      - name: Calendario MotoGP
        run: python build_motogp.py
      - name: Report MotoGP, foto e mappe (solo le novità), pronostici
        run: |
          python build_report_moto.py
          python build_cronaca.py || true
          python foto_motogp.py || true
          python foto_circuiti_moto.py || true
          python build_pronostici.py
      - name: Classifiche F2 e F3 (Wikipedia)
        run: python build_formule.py
      - name: Schede carriera e biografie (riprende da dove era arrivato)
        run: python build_schede.py || true
      - name: Archivi storici F1 e MotoGP (solo il lunedì)
        run: if [ "$(date +%u)" = "1" ]; then python build_archivio.py && python build_motogp_archivio.py; fi
      - name: Calendari scaricabili
        run: python build_calendari.py
      - name: Pubblica la gara sul canale Telegram (una sola volta per gara)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE }}
        run: python telegram_post.py
      - name: Commit se ci sono novità
        run: |
          git config user.name "gpoggi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data docs/calendario docs/img/foto foto_cache.json foto_motogp_cache.json foto_circuiti_moto_cache.json schede_cache.json telegram_stato.json 2>/dev/null || git add docs/data docs/calendario docs/img/foto foto_cache.json
          git diff --cached --quiet || (git commit -m "dati: aggiornamento da OpenF1" && git pull --rebase origin main && git push)
