name: Video poker

# Video lezione di poker: «Quando chiamare: la matematica del Texas Hold'em» (16 scene), nell'ambiente del gioco. Si lancia a mano; va sul Telegram del proprietario.
on:
  workflow_dispatch:
    inputs:
      prova:
        description: 'solo le prime N battute (prova; non invia)'
        default: ''
      corso:
        description: 'pratico = video breve e discorsivo sul conto da fare a mente (consigliato); si = corso lungo da zero; vuoto = versione dalla sceneggiatura'
        default: 'pratico'

permissions:
  contents: read

concurrency:
  group: video-poker
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt edge-tts piper-tts kokoro-onnx soundfile azure-cognitiveservices-speech playwright
      - run: python -m playwright install --with-deps chromium
      - name: Installa ffmpeg
        run: |
          for i in 1 2 3; do timeout 150 sudo apt-get update -qq && timeout 200 sudo apt-get install -y -qq ffmpeg && break; sleep 5; done
      - name: Crea e invia la video lezione di poker
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE || secrets.TELEGRAM_CHAT_ID || '559225883' }}
          PROVA: ${{ github.event.inputs.prova }}
          CORSO: ${{ github.event.inputs.corso }}
        run: |
          python video/poker.py $( [ -n "$PROVA" ] && echo --prova "$PROVA" ) $( [ "$CORSO" = pratico ] && echo --pratico || { [ -n "$CORSO" ] && echo --corso; } ) --invia --uscita /tmp/poker.mp4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-poker
          path: |
            /tmp/poker.mp4
            /tmp/poker.capitoli.txt
          retention-days: 7
